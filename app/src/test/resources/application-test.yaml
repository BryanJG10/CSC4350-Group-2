spring:
  datasource:
    # Tests run against an in-memory database so they do not need (or touch)
    # the real Postgres instance.
    url: jdbc:h2:mem:dining_hall_review;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
