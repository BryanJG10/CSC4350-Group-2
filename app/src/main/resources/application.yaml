spring:
  application:
    name: app

  # Optional: loads KEY=value pairs from app/.env when the app is started from
  # the app/ directory (e.g. `./gradlew bootRun`). Real environment variables
  # take precedence, so this is safe to leave in place.
  config:
    import: optional:file:.env[.properties]

  datasource:
    # Credentials come from the environment so they are never committed.
    # See the "Backend / Database Setup" section of README.md.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:dining_hall_review}?sslmode=${DB_SSLMODE:require}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: dining-hall-pool
      maximum-pool-size: ${DB_POOL_SIZE:5}
      minimum-idle: 1
      connection-timeout: 10000

  jpa:
    open-in-view: false
    hibernate:
      # "update" keeps the schema in sync while the model is changing quickly.
      # Switch to "validate" once the schema is stable and managed by migrations.
      ddl-auto: ${JPA_DDL_AUTO:update}

    properties:
      hibernate:
        jdbc:
          time_zone: UTC
    show-sql: ${JPA_SHOW_SQL:false}

# Container Apps asks the app whether it is alive before sending it traffic.
# Only the health endpoint is exposed, so nothing else is reachable from outside.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      # report up or down only, so the database details stay private
      show-details: never
      probes:
        # adds /actuator/health/liveness and /actuator/health/readiness
        enabled: true
